# Windows + CUDA build configuration for llama-cpp-2

[build]
# Uncomment and set if your CUDA toolkit is not auto-detected:
# rustflags = ["-C", "link-arg=-LC:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.x/lib/x64"]

[env]
# Required by llama-cpp-sys-2 (bindgen) to generate Rust bindings from C++ headers.
# Points to the directory containing libclang.dll.
LIBCLANG_PATH = "C:/Program Files/LLVM/bin"

# Force CUDA device ordering to match physical slot order (slot 0 = 4070 Ti Super, slot 1 = 2060)
CUDA_DEVICE_ORDER = "PCI_BUS_ID"

[target.x86_64-pc-windows-msvc]
# MSVC linker — standard for Windows Rust + CUDA
linker = "link.exe"
