[package]
name        = "turboquant-loader"
version     = "0.1.0"
edition     = "2021"
description = "Local LLM inference server with TurboQuant KV cache compression and OpenAI-compatible API"
repository  = "https://github.com/arozz7/TurboQuantLoader"
license     = "MIT"

# ─── Feature Flags ───────────────────────────────────────────────────────────
[features]
default  = ["cuda"]
# Enable CUDA backend for llama-cpp-2 (requires CUDA Toolkit 12.x)
cuda     = ["llama-cpp-2/cuda"]
# TurboQuant native KV cache — off until tq-kv adds Qwen3.5 MoE support
turbo-kv = ["dep:tq-kv", "dep:turboquant"]
# ratatui TUI (Phase 5B)
tui      = ["dep:ratatui", "dep:crossterm"]

# ─── Dependencies ─────────────────────────────────────────────────────────────
[dependencies]

# Inference backend — GGUF loading, CUDA multi-GPU, KV cache quantization
llama-cpp-2 = { version = "0.1", features = [] }

# TurboQuant KV cache compression (optional, see turbo-kv feature)
tq-kv      = { version = "*", optional = true }
turboquant = { version = "*", optional = true }

# HTTP server (Phase 4)
axum         = { version = "0.7", features = ["macros"] }
tower-http   = { version = "0.5", features = ["cors", "trace"] }
tokio        = { version = "1",   features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow    = "1"
thiserror = "1"

# GPU telemetry via NVML (Phase 3 bench command)
nvml-wrapper = "0.10"

# Async utilities
futures = "0.3"
uuid    = { version = "1", features = ["v4"] }

# TUI — only compiled with `--features tui` (Phase 5B)
ratatui   = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }

# ─── Build Profiles ───────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto       = "thin"
strip     = true

[profile.dev]
opt-level = 1   # slightly faster builds during development
