[package]
name        = "turboquant-loader"
version     = "0.1.0"
edition     = "2021"
description = "Local LLM inference server with TurboQuant KV cache compression and OpenAI-compatible API"
repository  = "https://github.com/arozz7/TurboQuantLoader"
license     = "MIT"

# ─── Feature Flags ───────────────────────────────────────────────────────────
# Default is CPU-only so the crate builds everywhere without extra toolchain setup.
# Enable the appropriate GPU backend for your platform:
#
#   Windows / Linux (NVIDIA):  --features cuda
#   macOS / iOS (Apple GPU):   --features metal
#   Android / fallback GPU:    --features vulkan
#   No GPU at all:             --no-default-features  (or just `default = []`)
[features]
default = []

# ── GPU backends (mutually exclusive in practice; pick one) ──────────────────
# CUDA — NVIDIA GPUs on Windows and Linux. Requires CUDA Toolkit 12.x.
cuda   = ["llama-cpp-2/cuda",   "dep:nvml-wrapper"]

# Metal — Apple Silicon and Intel Macs, plus iOS devices.
# No extra system dependency; Metal ships with macOS/iOS SDKs.
metal  = ["llama-cpp-2/metal"]

# Vulkan — cross-platform GPU compute; primary path for Android.
# Requires Vulkan SDK on desktop; ships with Android NDK.
vulkan = ["llama-cpp-2/vulkan"]

# ── Optional capabilities ─────────────────────────────────────────────────────
# TurboQuant native KV compression — off until tq-kv supports Qwen3.5 MoE.
turbo-kv = ["dep:tq-kv", "dep:turboquant"]

# ratatui TUI (Phase 5B) — desktop only.
tui = ["dep:ratatui", "dep:crossterm"]

# ─── Dependencies ─────────────────────────────────────────────────────────────
[dependencies]

# Inference backend — GGUF loading, multi-GPU, KV cache quantization.
# GPU backend selected via features above; compiles to CPU-only with no features.
llama-cpp-2 = { version = "0.1", features = [] }

# TurboQuant KV cache compression (optional — see turbo-kv feature)
tq-kv      = { version = "*", optional = true }
turboquant = { version = "*", optional = true }

# GPU telemetry — NVIDIA only, compiled in only when cuda feature is enabled
nvml-wrapper = { version = "0.10", optional = true }

# HTTP server (Phase 4)
axum         = { version = "0.7", features = ["macros"] }
tower-http   = { version = "0.5", features = ["cors", "trace"] }
tokio        = { version = "1",   features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow    = "1"
thiserror = "1"

# Async utilities
futures = "0.3"
uuid    = { version = "1", features = ["v4"] }

# TUI — compiled only with `--features tui` (Phase 5B, desktop only)
ratatui   = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }

# ─── Build Profiles ───────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto       = "thin"
strip     = true

[profile.dev]
opt-level = 1   # slightly faster incremental builds during development
