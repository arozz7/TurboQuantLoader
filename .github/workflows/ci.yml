name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      # CI runners have no GPU drivers; build CPU-only on all platforms.
      # This validates the codebase compiles cleanly without any GPU backend.
      - name: Cargo check (CPU-only)
        run: cargo check --no-default-features

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy (CPU-only)
        run: cargo clippy --no-default-features -- -D warnings

  # Separate job: validate Metal feature compiles on macOS (no GPU needed to compile)
  check-metal:
    name: Check Metal feature — macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM (provides libclang for bindgen)
        run: brew install llvm
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-metal-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Cargo check (metal feature)
        run: cargo check --no-default-features --features metal
        env:
          LIBCLANG_PATH: /opt/homebrew/opt/llvm/lib
